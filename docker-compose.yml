version: "3.9"

services:

  backend:
    build: ./backend
    container_name: wa-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    restart: always

  db:
    image: postgres:15
    container_name: wa-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "1457:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: always

  frontend:
    build: ./frontend
    container_name: wa-frontend
    depends_on:
      - backend
    restart: always

  nginx:
    image: nginx:latest
    container_name: wa-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - backend
    restart: always

volumes:
  postgres_data: